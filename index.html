<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آبمیوه سلامت | منوی دیجیتال</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="منوی دیجیتال آبمیوه سلامت">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            direction: rtl;
            overflow-x: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        .loading-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .loading-screen h1 {
            color: #f59e0b;
            margin-top: 20px;
            font-size: 2rem;
        }

        .loading-screen p {
            color: #94a3b8;
            margin-top: 10px;
        }

        /* Header Fixed */
        .header-fixed {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        .header-fixed img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .header-fixed h2 {
            font-size: 1.1rem;
            color: #f59e0b;
        }

        .header-fixed nav {
            display: flex;
            gap: 15px;
        }

        .header-fixed nav a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 15px;
            border-radius: 8px;
            transition: 0.3s;
            background: #1e293b;
        }

        .header-fixed nav a:hover {
            background: #f59e0b;
            color: #0f172a;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: slideUp 1s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            color: #f59e0b;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .hero p {
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .hero-btn {
            background: #f59e0b;
            color: #0f172a;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
            display: inline-block;
        }

        .hero-btn:hover {
            background: #d97706;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }

        /* Top Products */
        .top-products {
            padding: 60px 20px;
            background: #1e293b;
        }

        .top-products h2 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .top-slider {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px;
            scroll-snap-type: x mandatory;
        }

        .top-card {
            min-width: 200px;
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            scroll-snap-align: start;
            transition: 0.3s;
            cursor: pointer;
        }

        .top-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .top-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #f59e0b;
        }

        .top-card h3 {
            color: #e2e8f0;
            font-size: 1.1rem;
        }

        /* Search Box */
        .search-box {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            background: #0f172a;
        }

        #search {
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-family: 'Vazirmatn';
            font-size: 1rem;
            transition: 0.3s;
        }

        #search:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        /* Category Filter */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            background: #0f172a;
        }

        .category-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Vazirmatn';
            font-size: 1rem;
            transition: 0.3s;
            white-space: nowrap;
        }

        .category-btn.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
            font-weight: 700;
        }

        .category-btn:hover {
            border-color: #f59e0b;
            transform: translateY(-2px);
        }

        .category-btn .emoji {
            font-size: 1.2rem;
            margin-left: 5px;
        }

        /* Size Buttons */
        .sizes {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            background: #0f172a;
        }

        .size {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Vazirmatn';
            font-size: 1rem;
            transition: 0.3s;
        }

        .size.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
            font-weight: 700;
        }

        .size:hover {
            border-color: #f59e0b;
            transform: translateY(-2px);
        }

        /* Category Section Title */
        .category-title {
            text-align: center;
            color: #f59e0b;
            font-size: 1.8rem;
            margin: 30px 0 20px;
            padding: 0 20px;
        }

        .category-title .emoji {
            font-size: 2rem;
        }

        /* Menu Grid */
        .menu {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background: #0f172a;
        }

        .menu-item {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            border-color: #f59e0b;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
        }

        .menu-item .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .menu-item .badge.new {
            background: #10b981;
        }

        .menu-item .badge.special {
            background: #8b5cf6;
        }

        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .menu-item h3 {
            color: #f59e0b;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .menu-item .category-tag {
            display: inline-block;
            background: #0f172a;
            color: #94a3b8;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 10px 0;
        }

        .menu-item .description {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 10px 0;
            line-height: 1.6;
        }

        .menu-item .price {
            color: #10b981;
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .menu-item .size-label {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* Footer */
        .footer {
            background: #1e293b;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #334155;
        }

        .footer-card {
            margin-bottom: 30px;
        }

        .footer-card h2 {
            color: #f59e0b;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .footer-card p {
            color: #94a3b8;
        }

        .footer-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .footer-btn {
            background: #0f172a;
            color: #e2e8f0;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            display: inline-block;
            border: 1px solid #334155;
        }

        .footer-btn:hover {
            background: #f59e0b;
            color: #0f172a;
            transform: translateY(-3px);
        }

        .work-time {
            color: #94a3b8;
            line-height: 2;
            font-size: 1.1rem;
        }

        /* Scroll to Top */
        #scrollTop {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #f59e0b;
            color: #0f172a;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: none;
            z-index: 999;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
        }

        #scrollTop:hover {
            background: #d97706;
            transform: translateY(-5px);
        }

        /* Modal */
        .product-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            overflow-y: auto;
        }

        .product-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
            text-align: center;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 2rem;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.3s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0f172a;
        }

        .close-modal:hover {
            color: #f59e0b;
            background: #334155;
        }

        .modal-content img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #f59e0b;
        }

        .modal-content h2 {
            color: #f59e0b;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .modal-content p {
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .modal-price {
            background: #0f172a;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: right;
        }

        .modal-price h4 {
            color: #f59e0b;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .modal-price p {
            color: #e2e8f0;
            margin: 10px 0;
            padding: 8px;
            background: #1e293b;
            border-radius: 8px;
        }

        .order-btn {
            background: #10b981;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            font-weight: 700;
            transition: 0.3s;
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .order-btn:hover {
            background: #059669;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero p {
                font-size: 1rem;
            }
            
            .menu {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            
            .header-fixed nav {
                display: none;
            }
            
            .header-fixed {
                justify-content: center;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .modal-content img {
                width: 150px;
                height: 150px;
            }
            
            .categories, .sizes {
                gap: 5px;
                padding: 10px;
            }
            
            .category-btn, .size {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }
    </style>

        let currentSize = 'لیوانی';
        let currentCategory = 'all';

        // Display Menu
        function displayMenu(items) {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';
            
            if (items.length === 0) {
                menuList.innerHTML = '<p style="text-align:center;color:#94a3b8;grid-column:1/-1;padding:50px;">😔 محصولی یافت نشد</p>';
                return;
            }
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                card.onclick = () => showProductModal(item);
                
                let badgeHTML = '';
                if (item.badge === 'new') {
                    badgeHTML = '<span class="badge new">جدید</span>';
                } else if (item.badge === 'special') {
                    badgeHTML = '<span class="badge special">ویژه</span>';
                }
                
                card.innerHTML = `
                    ${badgeHTML}
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='logo.png.jpg'">
                    <h3>${item.name}</h3>
                    <span class="category-tag">${item.category}</span>
                    <p class="description">${item.description}</p>
                    <div class="price">${item.prices[currentSize]} تومان</div>
                    <div class="size-label">${currentSize}</div>
                `;
                
                menuList.appendChild(card);
            });
        }

        // Category Filter
        document.querySelectorAll('.category-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                
                let filteredItems;
                if (currentCategory === 'all') {
                    filteredItems = menuData;
                } else {
                    filteredItems = menuData.filter(item => item.category === currentCategory);
                }
                
                displayMenu(filteredItems);
            });
        });

        // Size Filter
        document.querySelectorAll('.size').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.size').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSize = e.target.dataset.size;
                
                // Refresh display with current category
                let filteredItems;
                if (currentCategory === 'all') {
                    filteredItems = menuData;
                } else {
                    filteredItems = menuData.filter(item => item.category === currentCategory);
                }
                
                displayMenu(filteredItems);
            });
        });

        // Search Function
        document.getElementById('search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = menuData.filter(item => 
                item.name.toLowerCase().includes(searchTerm) ||
                item.category.toLowerCase().includes(searchTerm) ||
                item.description.toLowerCase().includes(searchTerm)
            );
            displayMenu(filtered);
        });

        // Show Product Modal
        function showProductModal(item) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalImage').src = item.image;
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalDesc').textContent = item.description;
            
            let pricesHTML = '<h4>💰 قیمت‌ها:</h4>';
            for (const [size, price] of Object.entries(item.prices)) {
                pricesHTML += `<p>${size}: ${price} تومان</p>`;
            }
            document.getElementById('modalPrice').innerHTML = pricesHTML;
            
            modal.classList.add('active');
        }

        // Close Modal
        document.querySelector('.close-modal').addEventListener('click', () => {
            document.getElementById('productModal').classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (e.target.id === 'productModal') {
                document.getElementById('productModal').classList.remove('active');
            }
        });

        // Scroll to Top
        const scrollTopBtn = document.getElementById('scrollTop');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTopBtn.style.display = 'block';
            } else {
                scrollTopBtn.style.display = 'none';
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Smooth Scroll for Links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.querySelector('.loading-screen').style.display = 'none';
            }, 2000);
        });

        // Initial Display
        displayMenu(menuData);
    </script>
