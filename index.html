<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آبمیوه سلامت | منوی دیجیتال</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            direction: rtl;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Loading */
        .loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: 0.5s;
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader {
            width: 70px; height: 70px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }
        .header-name {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 900;
        }
        .header-phone {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .phone-link {
            color: var(--text-light);
            text-decoration: none;
            background: var(--bg-card);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
        }
        .phone-link:hover {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 80px 20px 40px;
            position: relative;
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .hero-logo {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 5px solid var(--primary);
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
            object-fit: cover;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .hero h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .hero-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--bg-dark);
        }
        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.3);
        }
        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }
        .btn-whatsapp {
            background: #25D366;
            color: white;
        }
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-4px);
        }
        .hero-contact {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .contact-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contact-chip:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--bg-dark);
        }

        /* Search */
        .search-box {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: var(--bg-dark);
            position: sticky;
            top: 70px;
            z-index: 100;
        }
        #search {
            width: 100%;
            max-width: 500px;
            padding: 14px 20px;
            border-radius: 50px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-light);
            font-family: 'Vazirmatn';
            font-size: 0.95rem;
            transition: 0.3s;
        }
        #search:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            background: var(--bg-dark);
            flex-wrap: nowrap;
        }
        .cat-btn {
            background: var(--bg-card);
            color: var(--text-light);
            border: 2px solid var(--border);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Vazirmatn';
            white-space: nowrap;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .cat-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            font-weight: 700;
        }
        .cat-btn:hover { border-color: var(--primary); }

        /* Sizes */
        .sizes {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            flex-wrap: wrap;
            background: var(--bg-dark);
        }
        .size-btn {
            background: var(--bg-card);
            color: var(--text-light);
            border: 2px solid var(--border);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Vazirmatn';
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .size-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            font-weight: 700;
        }
        .size-btn:hover { border-color: var(--primary); }

        /* Menu */
        .menu {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-dark);
        }
        .menu-item {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: 0.3s;
            cursor: pointer;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .menu-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .menu-item h3 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .menu-item .tag {
            display: inline-block;
            background: var(--bg-dark);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin: 5px 0;
        }
        .menu-item .desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 8px 0;
            line-height: 1.7;
        }
        .menu-item .price {
            color: var(--success);
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 10px;
        }
        .menu-item .size-label {
            color: #64748b;
            font-size: 0.75rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            overflow-y: auto;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 30px;
            max-width: 450px;
            width: 92%;
            text-align: center;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 12px; left: 12px;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 35px; height: 35px;
            border-radius: 50%;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            border: none;
        }
        .modal-close:hover { color: var(--danger); }
        .modal img {
            width: 160px; height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            margin-bottom: 20px;
        }
        .modal h2 { color: var(--primary); margin-bottom: 8px; }
        .modal .desc { color: var(--text-muted); margin-bottom: 15px; line-height: 1.8; }
        .modal-prices {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 12px;
            text-align: right;
            margin-bottom: 20px;
        }
        .modal-prices p {
            padding: 6px 10px;
            margin: 3px 0;
            background: var(--bg-card);
            border-radius: 8px;
            color: var(--text-light);
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btns .btn {
            font-size: 0.9rem;
            padding: 12px 20px;
        }

        /* Footer */
        .footer {
            background: var(--bg-card);
            padding: 50px 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }
        .footer h2 { color: var(--primary); font-size: 2rem; margin-bottom: 5px; }
        .footer .slogan { color: var(--text-muted); margin-bottom: 30px; }
        .footer-phones {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .footer-phone {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 15px 25px;
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-phone:hover {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            transform: translateY(-3px);
        }
        .footer-whatsapp {
            background: #25D366 !important;
            color: white !important;
            border-color: #25D366 !important;
        }
        .footer-whatsapp:hover {
            background: #128C7E !important;
            border-color: #128C7E !important;
        }
        .work-time {
            color: var(--text-muted);
            line-height: 2;
            font-size: 1rem;
        }
        .work-time i { color: var(--primary); margin-left: 5px; }

        /* Scroll Top */
        #scrollTop {
            position: fixed;
            bottom: 25px; left: 25px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            width: 48px; height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
            z-index: 999;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
        }
        #scrollTop:hover { transform: translateY(-4px); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .menu { grid-template-columns: 1fr; padding: 10px; }
            .header-phone .phone-link span { display: none; }
            .header-phone .phone-link { padding: 8px 12px; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>

        let currentSize = 'لیوانی';
        let currentCategory = 'all';
        let currentModalItem = null;

        // نمایش منو
        function displayMenu(items) {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:50px;">😔 محصولی یافت نشد</p>';
                return;
            }
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='logo.png.jpg'">
                    <h3>${item.name}</h3>
                    <span class="tag">${item.category}</span>
                    <p class="desc">${item.description}</p>
                    <div class="price">${item.prices[currentSize]} تومان</div>
                    <div class="size-label">${currentSize}</div>
                `;
                list.appendChild(card);
            });
        }

        // فیلتر دسته‌بندی
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                const filtered = currentCategory === 'all' ? menuData : menuData.filter(i => i.category === currentCategory);
                displayMenu(filtered);
            });
        });

        // فیلتر سایز
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSize = btn.dataset.size;
                const filtered = currentCategory === 'all' ? menuData : menuData.filter(i => i.category === currentCategory);
                displayMenu(filtered);
            });
        });

        // جستجو
        document.getElementById('search').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            const filtered = menuData.filter(i => 
                i.name.toLowerCase().includes(term) || 
                i.category.toLowerCase().includes(term) ||
                i.description.toLowerCase().includes(term)
            );
            displayMenu(filtered);
        });

        // مودال
        function openModal(item) {
            currentModalItem = item;
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalDesc').textContent = item.description;
            
            let html = '';
            for (const [size, price] of Object.entries(item.prices)) {
                html += `<p><strong>${size}:</strong> ${price} تومان</p>`;
            }
            document.getElementById('modalPrices').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // اسکرول به بالا
        const scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            scrollBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
        });

        // لودینگ
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 1500);
        });

        // نمایش اولیه
        displayMenu(menuData);
    </script>
