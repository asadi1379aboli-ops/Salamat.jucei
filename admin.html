<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | آبمیوه سلامت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
            --muted: #94a3b8; --primary: #f59e0b; --success: #10b981;
            --danger: #ef4444; --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-screen.hidden { display: none; }
        .login-box { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; max-width: 420px; width: 90%; }
        .login-box h1 { color: var(--primary); margin-bottom: 5px; }
        .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 15px; }
        .login-box label { display: block; text-align: right; color: var(--muted); font-size: 0.8rem; margin: 8px 0 4px; }
        .login-box input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: 'Vazirmatn'; font-size: 0.9rem; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: var(--bg); border: none; border-radius: 10px; font-family: 'Vazirmatn'; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 15px; }
        .login-error { color: var(--danger); margin-top: 10px; display: none; font-size: 0.85rem; }

        .dashboard { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; }
        .dashboard.active { display: block; }
        .dash-header { background: var(--card); padding: 15px 20px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dash-header h2 { color: var(--primary); font-size: 1.2rem; }
        .btn { padding: 8px 16px; border-radius: 10px; border: none; font-family: 'Vazirmatn'; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; }
        .btn-success { background: var(--success); color: white; }
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat .num { font-size: 1.5rem; font-weight: 900; color: var(--primary); }
        .stat .label { color: var(--muted); font-size: 0.75rem; }
        .sync-status { background: var(--card); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
        .sync-dot.online { background: var(--success); }
        .sync-dot.offline { background: var(--danger); }

        .table-wrap { background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: var(--bg); padding: 10px; text-align: right; color: var(--primary); font-weight: 700; font-size: 0.8rem; border-bottom: 2px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
        tr:hover td { background: rgba(245,158,11,0.03); }
        .product-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .icon-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; display: inline-flex; align-items: center; justify-content: center; }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
        .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); border-radius: 16px; padding: 25px; max-width: 650px; width: 95%; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal h3 { color: var(--primary); margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 0.78rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: 'Vazirmatn'; font-size: 0.85rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .tag-input { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); min-height: 40px; }
        .tag-item { background: var(--primary); color: var(--bg); padding: 3px 10px; border-radius: 15px; font-size: 0.75rem; display: flex; align-items: center; gap: 5px; }
        .tag-item button { background: none; border: none; color: var(--bg); cursor: pointer; font-size: 0.8rem; }

        .file-upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .file-upload-area:hover { border-color: var(--primary); background: rgba(245,158,11,0.05); }
        .file-upload-area i { font-size: 2rem; color: var(--primary); margin-bottom: 8px; }
        .file-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .file-item { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .file-item img, .file-item video { width: 100%; height: 100%; object-fit: cover; }
        .file-item button { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; border: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 0.6rem; }

        .toast { position: fixed; bottom: 20px; right: 50%; transform: translateX(50%); padding: 10px 20px; border-radius: 50px; font-weight: 700; z-index: 9999; font-size: 0.85rem; animation: fadeIn 0.3s; }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }
        .toast.info { background: #3b82f6; color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(50%) translateY(10px); } to { opacity: 1; transform: translateX(50%) translateY(0); } }

        @media (max-width: 768px) { .form-row, .form-row-3, .price-grid { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <!-- Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>🔐 پنل مدیریت</h1>
            <p>آبمیوه سلامت</p>
            <label>توکن GitHub</label>
            <input type="password" id="githubToken" placeholder="ghp_...">
            <label>رمز عبور</label>
            <input type="password" id="password" placeholder="admin123">
            <button onclick="login()">🚀 ورود</button>
            <p class="login-error" id="loginError"></p>
            <p style="color:var(--muted);font-size:0.7rem;margin-top:10px;">توکن رو از github.com/settings/tokens بساز</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dash-header">
            <h2>🍹 مدیریت منو</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-success" onclick="openAdd()"><i class="fas fa-plus"></i> محصول جدید</button>
                <button class="btn btn-purple" onclick="publishNow()"><i class="fas fa-cloud-upload-alt"></i> 🚀 انتشار در سایت</button>
                <button class="btn btn-outline" onclick="loadFromGitHub()"><i class="fas fa-download"></i> دریافت</button>
                <button class="btn btn-outline" onclick="exportJSON()"><i class="fas fa-file-export"></i> خروجی</button>
                <button class="btn btn-outline" onclick="document.getElementById('importModal').classList.add('active')"><i class="fas fa-file-import"></i> ورودی</button>
                <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </div>

        <div class="sync-status">
            <div class="sync-dot" id="syncDot"></div>
            <span id="syncText">آماده به کار</span>
            <span style="margin-right:auto;color:var(--muted);font-size:0.75rem;" id="syncTime"></span>
        </div>

        <div class="stats">
            <div class="stat"><div class="num" id="statTotal">۰</div><div class="label">محصولات</div></div>
            <div class="stat"><div class="num" id="statCats">۰</div><div class="label">دسته‌بندی</div></div>
            <div class="stat"><div class="num" id="statDiscounts">۰</div><div class="label">تخفیف‌دار</div></div>
            <div class="stat"><div class="num" id="statViews">۰</div><div class="label">کل بازدید</div></div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>عکس</th><th>نام</th><th>دسته</th><th>وضعیت</th><th>تخفیف</th><th>قیمت</th><th>بازدید</th><th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <h3 id="modalTitle">➕ محصول جدید</h3>
            
            <div class="form-group"><label>نام محصول *</label><input type="text" id="pName" placeholder="آب پرتقال"></div>
            
            <div class="form-group">
                <label>تصاویر و فیلم</label>
                <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p style="color:var(--muted);">کلیک کن یا فایل رو بکش اینجا</p>
                    <p style="color:var(--muted);font-size:0.7rem;">عکس (jpg, png, webp) یا فیلم (mp4)</p>
                </div>
                <input type="file" id="fileInput" multiple accept="image/*,video/mp4" style="display:none;" onchange="handleFiles(this.files)">
                <div class="file-list" id="fileList"></div>
            </div>
            
            <div class="form-group"><label>توضیحات</label><textarea id="pDesc" rows="2"></textarea></div>
            
            <div class="form-group">
                <label>مواد تشکیل‌دهنده</label>
                <div class="tag-input" id="ingredientsTags" onclick="document.getElementById('ingredientInput').focus()">
                    <input type="text" id="ingredientInput" placeholder="بنویس و Enter بزن..." style="border:none;background:transparent;color:var(--text);flex:1;min-width:100px;padding:4px;font-family:'Vazirmatn';font-size:0.8rem;" onkeypress="if(event.key==='Enter'){event.preventDefault();addIngredient();}">
                </div>
            </div>
            
            <div class="form-group">
                <label>پیشنهادهای ترکیبی</label>
                <div class="tag-input" id="comboTags" onclick="document.getElementById('comboInput').focus()">
                    <input type="text" id="comboInput" placeholder="نام محصول رو بنویس و Enter بزن..." style="border:none;background:transparent;color:var(--text);flex:1;min-width:100px;padding:4px;font-family:'Vazirmatn';font-size:0.8rem;" onkeypress="if(event.key==='Enter'){event.preventDefault();addCombo();}">
                </div>
            </div>
            
            <div class="form-row-3">
                <div class="form-group">
                    <label>دسته‌بندی</label>
                    <select id="pCat">
                        <option>پرفروش‌ها</option><option>آبمیوه طبیعی</option><option>آبمیوه فصل</option>
                        <option>ترش</option><option>ترکیبی</option><option>شیک</option>
                        <option>اسموتی</option><option>رژیمی</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>وضعیت</label>
                    <select id="pStatus">
                        <option value="available">✅ موجود</option>
                        <option value="low">⏳ رو به اتمام</option>
                        <option value="unavailable">❌ ناموجود</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نشان</label>
                    <select id="pBadge">
                        <option value="">بدون نشان</option>
                        <option value="special">⭐ پرفروش</option>
                        <option value="new">🆕 جدید</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group"><label>امتیاز (۱-۵)</label><input type="number" id="pStars" min="1" max="5" value="4"></div>
                <div class="form-group"><label>کالری</label><input type="text" id="pCal" placeholder="۱۲۰"></div>
            </div>
            
            <div class="form-row">
                <div class="form-group"><label>تخفیف (٪)</label><input type="number" id="pDiscount" min="0" max="99" value="0" placeholder="۰ = بدون تخفیف"></div>
                <div class="form-group"><label>ترتیب نمایش</label><input type="number" id="pOrder" value="1"></div>
            </div>
            
            <label style="color:var(--muted);font-size:0.8rem;display:block;margin-bottom:6px;">💰 قیمت‌ها (تومان - فقط عدد)</label>
            <div class="price-grid">
                <div class="form-group"><label>لیوانی</label><input type="text" id="p1" placeholder="85000"></div>
                <div class="form-group"><label>نیم‌لیتری</label><input type="text" id="p2" placeholder="140000"></div>
                <div class="form-group"><label>یک‌لیتری</label><input type="text" id="p3" placeholder="220000"></div>
                <div class="form-group"><label>خانوادگی</label><input type="text" id="p4" placeholder="300000"></div>
            </div>
            
            <input type="hidden" id="editIdx" value="-1">
            <div class="modal-btns">
                <button class="btn btn-success" onclick="saveProduct()"><i class="fas fa-save"></i> 💾 ذخیره</button>
                <button class="btn btn-outline" onclick="closeProductModal()">انصراف</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <h3>📥 ورود JSON</h3>
            <div class="form-group"><textarea id="importJson" style="min-height:200px;direction:ltr;text-align:left;font-family:monospace;font-size:0.75rem;"></textarea></div>
            <div class="modal-btns">
                <button class="btn btn-success" onclick="importData()">وارد کردن</button>
                <button class="btn btn-outline" onclick="document.getElementById('importModal').classList.remove('active')">انصراف</button>
            </div>
        </div>
    </div>

    <script>
        const USER = 'asadi1379aboli-ops';
        const REPO = 'Salamat.jucei';
        const FILE = 'data.json';
        const PASS = 'admin123';
        let token = '';
        let menuData = [];
        let tempIngredients = [];
        let tempCombos = [];
        let tempFiles = []; // ذخیره موقت فایل‌های آپلود شده

        function getData() { return JSON.parse(localStorage.getItem('admin_menu') || '[]'); }
        function setData(d) { localStorage.setItem('admin_menu', JSON.stringify(d)); menuData = d; refresh(); }

        function login() {
            const t = document.getElementById('githubToken').value.trim();
            const p = document.getElementById('password').value;
            if (!t.startsWith('ghp_')) { showError('توکن باید با ghp_ شروع بشه'); return; }
            if (p !== PASS) { showError('رمز اشتباهه'); return; }
            token = t;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
            loadFromGitHub();
        }

        function showError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = '❌ ' + msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2500);
        }

        function logout() {
            if (confirm('خارج میشی؟')) {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('dashboard').classList.remove('active');
                token = '';
            }
        }

        async function loadFromGitHub() {
            if (!token) return;
            try {
                const r = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`, { headers: { Authorization: `token ${token}` } });
                if (r.ok) {
                    const d = await r.json();
                    const data = JSON.parse(atob(d.content));
                    setData(data);
                    updateSyncStatus(true, 'داده‌ها از GitHub دریافت شد');
                    toast('✅ از سایت دریافت شد', 'success');
                } else if (r.status === 404) {
                    updateSyncStatus(true, 'فایل data.json هنوز وجود نداره');
                    toast('📝 با اولین انتشار، فایل ساخته میشه', 'info');
                }
            } catch (e) {
                updateSyncStatus(false, 'خطا در اتصال');
                toast('⚠️ خطا در دریافت', 'error');
            }
        }

        async function publishNow() {
            if (!token) { toast('❌ اول وارد شو', 'error'); return; }
            const data = getData();
            if (!data.length) { toast('❌ محصولی نیست', 'error'); return; }

            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            toast('🔄 در حال انتشار...', 'info');

            try {
                let sha = null;
                const cr = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`, { headers: { Authorization: `token ${token}` } });
                if (cr.ok) { const cd = await cr.json(); sha = cd.sha; }

                const body = {
                    message: `🔄 بروزرسانی منو - ${new Date().toLocaleString('fa-IR')}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                    branch: 'main'
                };
                if (sha) body.sha = sha;

                const r = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`, {
                    method: 'PUT',
                    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (r.ok) {
                    document.getElementById('syncTime').textContent = 'انتشار: ' + new Date().toLocaleTimeString('fa-IR');
                    updateSyncStatus(true, '✅ سایت با موفقیت آپدیت شد! 🎉');
                    toast('🎉 سایت آپدیت شد! چند ثانیه بعد ببین', 'success');
                } else {
                    const err = await r.json();
                    throw new Error(err.message);
                }
            } catch (e) {
                updateSyncStatus(false, 'خطا: ' + e.message);
                toast('❌ خطا: ' + e.message, 'error');
            }
        }

        function updateSyncStatus(online, msg) {
            document.getElementById('syncDot').className = 'sync-dot ' + (online ? 'online' : 'offline');
            document.getElementById('syncText').textContent = msg;
        }

        function refresh() {
            const d = getData();
            document.getElementById('statTotal').textContent = d.length.toLocaleString('fa-IR');
            document.getElementById('statCats').textContent = [...new Set(d.map(i => i.cat))].length.toLocaleString('fa-IR');
            document.getElementById('statDiscounts').textContent = d.filter(i => i.discount > 0).length.toLocaleString('fa-IR');
            document.getElementById('statViews').textContent = d.reduce((sum, i) => sum + (i.views || 0), 0).toLocaleString('fa-IR');

            document.getElementById('tableBody').innerHTML = d.map((item, i) => {
                const img = (item.images && item.images[0]) || item.image || 'logo.png.jpg';
                const statusLabels = { available: '✅', low: '⏳', unavailable: '❌' };
                return `
                    <tr>
                        <td>${i + 1}</td>
                        <td><img src="${img}" class="product-img" onerror="this.src='logo.png.jpg'"></td>
                        <td><strong>${item.name}</strong>${item.discount > 0 ? ` <span style="color:var(--danger);font-size:0.7rem;">-${item.discount}%</span>` : ''}</td>
                        <td>${item.cat}</td>
                        <td>${statusLabels[item.status] || '✅'}</td>
                        <td>${item.discount > 0 ? item.discount + '٪' : '-'}</td>
                        <td style="color:var(--success);">${(item.prices?.['لیوانی'] || '۰').replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',')} ت</td>
                        <td>${(item.views || 0).toLocaleString('fa-IR')}</td>
                        <td>
                            <button class="icon-btn" onclick="openEdit(${i})" title="ویرایش"><i class="fas fa-edit"></i></button>
                            <button class="icon-btn del" onclick="deleteProduct(${i})" title="حذف"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ========== FILE HANDLING ==========
        function handleFiles(files) {
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempFiles.push({
                        name: file.name,
                        data: e.target.result,
                        type: file.type
                    });
                    renderFileList();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = tempFiles.map((f, i) => `
                <div class="file-item">
                    ${f.type.startsWith('video') ? 
                        `<video src="${f.data}" muted></video>` : 
                        `<img src="${f.data}" alt="">`}
                    <button onclick="tempFiles.splice(${i},1);renderFileList();">✕</button>
                </div>
            `).join('');
        }

        // ========== TAGS ==========
        function addIngredient() {
            const input = document.getElementById('ingredientInput');
            const val = input.value.trim();
            if (val) { tempIngredients.push(val); input.value = ''; renderIngredients(); }
        }
        function renderIngredients() {
            const container = document.getElementById('ingredientsTags');
            const input = document.getElementById('ingredientInput');
            container.innerHTML = tempIngredients.map((t, i) => 
                `<span class="tag-item">${t} <button onclick="tempIngredients.splice(${i},1);renderIngredients();">✕</button></span>`
            ).join('') + '<input type="text" id="ingredientInput" placeholder="بنویس و Enter بزن..." style="border:none;background:transparent;color:var(--text);flex:1;min-width:100px;padding:4px;font-family:Vazirmatn;font-size:0.8rem;" onkeypress="if(event.key===\'Enter\'){event.preventDefault();addIngredient();}">';
            setTimeout(() => document.getElementById('ingredientInput')?.focus(), 50);
        }

        function addCombo() {
            const input = document.getElementById('comboInput');
            const val = input.value.trim();
            if (val) { tempCombos.push(val); input.value = ''; renderCombos(); }
        }
        function renderCombos() {
            const container = document.getElementById('comboTags');
            const input = document.getElementById('comboInput');
            container.innerHTML = tempCombos.map((t, i) => 
                `<span class="tag-item">${t} <button onclick="tempCombos.splice(${i},1);renderCombos();">✕</button></span>`
            ).join('') + '<input type="text" id="comboInput" placeholder="نام محصول رو بنویس و Enter بزن..." style="border:none;background:transparent;color:var(--text);flex:1;min-width:100px;padding:4px;font-family:Vazirmatn;font-size:0.8rem;" onkeypress="if(event.key===\'Enter\'){event.preventDefault();addCombo();}">';
            setTimeout(() => document.getElementById('comboInput')?.focus(), 50);
        }

        // ========== MODAL ==========
        function openAdd() {
            document.getElementById('modalTitle').textContent = '➕ محصول جدید';
            document.getElementById('editIdx').value = '-1';
            clearForm();
            tempIngredients = [];
            tempCombos = [];
            tempFiles = [];
            renderIngredients();
            renderCombos();
            renderFileList();
            document.getElementById('productModal').classList.add('active');
        }

        function openEdit(index) {
            const item = getData()[index];
            document.getElementById('modalTitle').textContent = '✏️ ویرایش: ' + item.name;
            document.getElementById('editIdx').value = index;
            document.getElementById('pName').value = item.name;
            document.getElementById('pDesc').value = item.desc || '';
            document.getElementById('pCat').value = item.cat;
            document.getElementById('pStatus').value = item.status || 'available';
            document.getElementById('pBadge').value = item.badge || '';
            document.getElementById('pStars').value = item.stars || 4;
            document.getElementById('pCal').value = item.cal || '';
            document.getElementById('pDiscount').value = item.discount || 0;
            document.getElementById('pOrder').value = item.order || 1;
            document.getElementById('p1').value = (item.prices?.['لیوانی'] || '').replace(/[^0-9]/g, '');
            document.getElementById('p2').value = (item.prices?.['نیم‌لیتری'] || '').replace(/[^0-9]/g, '');
            document.getElementById('p3').value = (item.prices?.['یک‌لیتری'] || '').replace(/[^0-9]/g, '');
            document.getElementById('p4').value = (item.prices?.['یک‌ونیم‌لیتری'] || '').replace(/[^0-9]/g, '');

            tempIngredients = [...(item.ingredients || [])];
            tempCombos = [...(item.combo || [])];
            tempFiles = [];
            renderIngredients();
            renderCombos();
            renderFileList();
            
            // Show existing images
            if (item.images) {
                tempFiles = item.images.map(img => ({
                    name: img.split('/').pop(),
                    data: img,
                    type: 'image'
                }));
                renderFileList();
            }

            document.getElementById('productModal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('active');
            clearForm();
        }

        function clearForm() {
            ['pName','pDesc','pCal','p1','p2','p3','p4'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pCat').value = 'آبمیوه طبیعی';
            document.getElementById('pStatus').value = 'available';
            document.getElementById('pBadge').value = '';
            document.getElementById('pStars').value = '4';
            document.getElementById('pDiscount').value = '0';
            document.getElementById('pOrder').value = '1';
            tempIngredients = [];
            tempCombos = [];
            tempFiles = [];
            renderIngredients();
            renderCombos();
            renderFileList();
        }

        function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            if (!name) { toast('❌ اسم رو بنویس', 'error'); return; }

            // Use uploaded files or existing ones
            let images = [];
            if (tempFiles.length > 0) {
                images = tempFiles.map(f => f.data); // Base64 data URLs
            }

            const formatPrice = (val) => {
                const num = parseInt(val) || 0;
                return num.toLocaleString('fa-IR');
            };

            const product = {
                name,
                images: images.length > 0 ? images : undefined,
                image: images.length > 0 ? images[0] : undefined,
                desc: document.getElementById('pDesc').value.trim(),
                ingredients: [...tempIngredients],
                prices: {
                    "لیوانی": formatPrice(document.getElementById('p1').value),
                    "نیم‌لیتری": formatPrice(document.getElementById('p2').value),
                    "یک‌لیتری": formatPrice(document.getElementById('p3').value),
                    "یک‌ونیم‌لیتری": formatPrice(document.getElementById('p4').value)
                },
                cat: document.getElementById('pCat').value,
                status: document.getElementById('pStatus').value,
                badge: document.getElementById('pBadge').value,
                stars: parseInt(document.getElementById('pStars').value) || 4,
                cal: document.getElementById('pCal').value.trim() || '---',
                discount: parseInt(document.getElementById('pDiscount').value) || 0,
                order: parseInt(document.getElementById('pOrder').value) || 1,
                combo: [...tempCombos],
                goals: [],
                views: 0
            };

            const data = getData();
            const idx = parseInt(document.getElementById('editIdx').value);
            
            if (idx >= 0) {
                product.views = data[idx].views || 0;
                product.goals = data[idx].goals || [];
                data[idx] = product;
            } else {
                data.push(product);
            }

            // Sort by order
            data.sort((a, b) => (a.order || 99) - (b.order || 99));
            
            setData(data);
            closeProductModal();
            toast('💾 ذخیره شد. حالا دکمه 🚀 انتشار رو بزن', 'info');
        }

        function deleteProduct(index) {
            const item = getData()[index];
            if (confirm(`حذف "${item.name}"؟`)) {
                const data = getData();
                data.splice(index, 1);
                setData(data);
                toast('🗑️ حذف شد. انتشار رو فراموش نکن', 'info');
            }
        }

        function exportJSON() {
            const data = getData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'menu-backup-' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            toast('📥 دانلود شد', 'success');
        }

        function importData() {
            try {
                const data = JSON.parse(document.getElementById('importJson').value.trim());
                if (!Array.isArray(data)) throw new Error('نامعتبر');
                if (confirm(`${data.length} محصول وارد شود؟`)) {
                    setData(data);
                    document.getElementById('importModal').classList.remove('active');
                    document.getElementById('importJson').value = '';
                    toast('✅ وارد شد', 'success');
                }
            } catch (e) {
                toast('❌ JSON نامعتبر', 'error');
            }
        }

        function toast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // Close modals
        document.getElementById('productModal').addEventListener('click', function(e) { if (e.target === this) closeProductModal(); });
        document.getElementById('importModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });

        // Init
        refresh();
    </script>
</body>
</html>
